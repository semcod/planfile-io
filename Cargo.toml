[package]
name = "planfile-io"
version = "0.1.0"
edition = "2021"
authors = ["Tom Sapletta <tom@sapletta.com>"]
description = "High-performance native I/O engine for planfile"
license = "Apache-2.0"

[lib]
name = "planfile_io_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.12"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
